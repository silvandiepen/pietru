name: Docs CI

on:
  push:
    branches: [main, development]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: bash -c 'cd apps/docs && rm -rf public && npx girk'
      - uses: actions/upload-artifact@v4
        with:
          name: docs-public
          path: apps/docs/public

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-public
          path: apps/docs/public
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy apps/docs/public --project-name=${{ github.ref == 'refs/heads/development' && 'pietru-docs-dev' || 'pietru-docs' }} --branch=${{ github.ref_name }}
