name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/api/**'
      - 'vitest.config.ts'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/api/**'
      - 'vitest.config.ts'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: for pkg in packages/auth packages/core packages/db packages/providers packages/validation; do npm run build --workspace=$pkg; done
      - run: npx vitest run apps/api packages

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: for pkg in packages/auth packages/core packages/db packages/providers packages/validation; do npm run build --workspace=$pkg; done
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
