name: Marketing CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'packages/**'
      - '.github/workflows/marketing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'packages/**'

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: bash -c 'cd apps/marketing && npx vite build'
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: apps/marketing/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marketing-dist
          path: apps/marketing/dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/marketing/dist --project-name=pietru-marketing
